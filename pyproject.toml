[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pngify"
version = "0.4"
description = "Inject and extract data from PNG files"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthew Shaw", email = "mshaw.cx@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
crypto = ["cryptography"]

[project.urls]
Homepage = "https://github.com/shawcx/pngify"

[project.scripts]
pngify = "pngify:main"

[tool.setuptools]
py-modules = ["pngify"]
